<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Courses | NovaLeran | Interactive Physics &amp; Natural Sciences</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="stylesheet" href="style.css?v=13">
  <!-- Google Identity Services SDK for Google Sign-In -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <!-- ======================================================================
       Brilliant Header & Navigation
       ====================================================================== -->
  <header class="brilliant-header">
    <div class="header-inner">
      <div class="header-left">
        <!-- Brilliant Multifaceted Cube Logo -->
        <div class="brand-logo" id="brand-logo-btn" title="Brilliant Home">
          <div class="brand-icon">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2L3 7.5v9L12 22l9-5.5v-9L12 2z" fill="#ffffff"/>
              <path d="M12 2l9 5.5-9 5.5-9-5.5L12 2z" fill="rgba(255,255,255,0.95)"/>
              <path d="M12 13v9l9-5.5v-9L12 13z" fill="rgba(255,255,255,0.7)"/>
              <path d="M12 13L3 7.5v9l9 5.5v-9z" fill="rgba(255,255,255,0.45)"/>
            </svg>
          </div>
          <span class="brand-name">NovaLeran</span>
        </div>

        <nav class="nav-links">
          <a class="nav-item active" data-nav="courses" href="#">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Courses</span>
            <div class="nav-indicator"></div>
          </a>
        </nav>
      </div>

      <!-- Right Header Actions (Sign In / User Profile) -->
      <div class="header-right" id="header-auth-container">
        <!-- Dynambically rendered by app.js -->
        <button class="nav-signin-btn" id="nav-signin-btn">Sign In</button>
      </div>
    </div>
  </header>

  <!-- ======================================================================
       Main Content (Learning Paths Only)
       ====================================================================== -->
  <main class="page-main">
    
    <!-- Hero Heading -->
    <div class="page-hero">
      <h1 class="page-title">Courses</h1>
      <p class="page-subtitle">Interactive Physics &amp; Natural Sciences</p>
    </div>

    <!-- Chapter Grid Container (Rendered dynamically by app.js) -->
    <div id="learning-paths-list">
      <!-- Chapter card rendered here -->
    </div>

  </main>

  <!-- ======================================================================
       Brilliant Footer
       ====================================================================== -->
  <footer style="width: 100%; background: #020c18; border-top: 1px solid var(--border-subtle); padding: 48px 32px;">
    <div style="max-width: 1360px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 24px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L3 7.5v9L12 22l9-5.5v-9L12 2z" fill="#ffffff"/>
        </svg>
        <span style="font-size: 18px; font-weight: 800; letter-spacing: 0.08em; color: #fff;">NovaLeran</span>
        <span style="font-size: 13px; color: var(--text-muted); margin-left: 12px;">
          © 2026 NovaLeran. Interactive Physics &amp; Science Curriculum.
        </span>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 20px; font-size: 13px; color: var(--text-secondary);">
        <a href="#" onclick="filterBySubject('All'); return false;">Nuclear Fusion &amp; Stars</a>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="curriculum-data.js?v=13"></script>
  <script src="app.js?v=13"></script>
</body>
</html>
