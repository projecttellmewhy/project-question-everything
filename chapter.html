<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Concept Mind Map | NovaLeran</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="stylesheet" href="style.css?v=15">
  <style>
    /* Dedicated Chapter Mind Map Layout Styles */
    .mm-layout-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
      padding: 16px 24px 32px;
      box-sizing: border-box;
      min-height: calc(100vh - 140px);
    }

    .mm-header-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 16px 20px;
      margin-bottom: 16px;
    }

    .mm-chapter-select {
      background: #081624;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      max-width: 280px;
      transition: border-color 0.2s;
    }
    .mm-chapter-select:hover, .mm-chapter-select:focus {
      border-color: var(--brilliant-blue);
    }

    .mm-view-toggle-group {
      display: flex;
      background: #081624;
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 3px;
      gap: 2px;
    }

    .mm-view-toggle-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .mm-view-toggle-btn.active {
      background: var(--brilliant-blue);
      color: #fff;
      box-shadow: 0 2px 8px rgba(47, 111, 238, 0.4);
    }

    .mm-workspace {
      flex: 1;
      display: flex;
      height: 680px;
      min-height: 520px;
      background: #040e1a;
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .mm-canvas-pane {
      flex: 1;
      position: relative;
      min-width: 0;
      height: 100%;
      cursor: grab;
    }

    .mm-floating-controls {
      position: absolute;
      bottom: 20px;
      left: 20px;
      display: flex;
      gap: 8px;
      background: rgba(6, 17, 29, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 6px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      z-index: 10;
    }

    .mm-control-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid transparent;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .mm-control-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .mm-hint-badge {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(8, 22, 36, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 11.5px;
      color: #94a3b8;
      pointer-events: none;
      white-space: nowrap;
      z-index: 10;
    }

    .mm-inspector {
      width: 320px;
      flex-shrink: 0;
      background: #061424;
      border-left: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 20px;
      box-sizing: border-box;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 20;
    }

    .mm-tree-pane {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      background: #040e1a;
      display: none;
    }

    /* Responsive Drawer on Tablets & Mobile */
    @media (max-width: 900px) {
      .mm-layout-wrapper {
        padding: 12px 14px 24px;
      }
      .mm-header-bar {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }
      .mm-chapter-select {
        max-width: 100%;
      }
      .mm-workspace {
        height: 560px;
        flex-direction: column;
      }
      .mm-inspector {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: 300px;
        max-width: 85%;
        box-shadow: -8px 0 24px rgba(0, 0, 0, 0.6);
        transform: translateX(100%);
      }
      .mm-inspector.open {
        transform: translateX(0);
      }
      .mm-inspector-toggle-mobile {
        display: flex !important;
      }
    }

    @media (max-width: 480px) {
      .mm-workspace {
        height: 480px;
      }
      .mm-floating-controls {
        bottom: 12px;
        left: 12px;
        padding: 4px;
      }
      .mm-control-btn {
        width: 30px;
        height: 30px;
        font-size: 12px;
      }
      .mm-hint-badge {
        font-size: 10px;
        padding: 4px 12px;
      }
    }
  </style>
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column; background: var(--bg-body, #031427); color: #fff; margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">

  <!-- Header & Navigation -->
  <header class="brilliant-header">
    <div class="header-inner">
      <div class="header-left">
        <!-- Brand Logo -->
        <a href="index.html" class="brand-logo" id="brand-logo-btn" title="NovaLeran Home" style="text-decoration: none;">
          <div class="brand-icon">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2L3 7.5v9L12 22l9-5.5v-9L12 2z" fill="#ffffff"/>
              <path d="M12 2l9 5.5-9 5.5-9-5.5L12 2z" fill="rgba(255,255,255,0.95)"/>
              <path d="M12 13v9l9-5.5v-9L12 13z" fill="rgba(255,255,255,0.7)"/>
              <path d="M12 13L3 7.5v9l9 5.5v-9z" fill="rgba(255,255,255,0.45)"/>
            </svg>
          </div>
          <span class="brand-name">NovaLeran</span>
        </a>

        <nav class="nav-links">
          <a class="nav-item" href="index.html">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Courses</span>
          </a>
        </nav>
      </div>

      <!-- Right Header Actions -->
      <div class="header-right">
        <a href="index.html" class="action-start-btn" style="text-decoration: none; padding: 7px 14px; font-size: 12.5px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px;">
          ← Back to Courses
        </a>
      </div>
    </div>
  </header>

  <!-- Mind Map App Content Area -->
  <main class="mm-layout-wrapper">
    
    <!-- Top Chapter Bar & Selector Controls -->
    <div class="mm-header-bar">
      <div style="display: flex; align-items: center; gap: 14px; flex-wrap: wrap;">
        <div>
          <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 2px;">
            <span id="chapter-header-badge" style="background: rgba(56, 189, 248, 0.18); border: 1px solid rgba(56, 189, 248, 0.4); color: #38bdf8; font-size: 10.5px; font-weight: 800; text-transform: uppercase; padding: 2px 8px; border-radius: 20px;">
              Chapter
            </span>
            <span id="chapter-header-meta" style="font-size: 12px; color: var(--text-muted);">
              Interactive Concept Map
            </span>
          </div>
          <h1 id="chapter-header-title" style="font-size: 22px; font-weight: 800; color: #fff; margin: 0;">
            Kinematics
          </h1>
        </div>

        <!-- Jump to Another Chapter Dropdown -->
        <select id="chapter-select-dropdown" class="mm-chapter-select" title="Switch Physics Chapter">
          <!-- Populated dynamically by chapter.js -->
        </select>
      </div>

      <!-- View Switcher (Interactive Graph vs Tree View) -->
      <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
        <div class="mm-view-toggle-group">
          <button id="btn-view-graph" class="mm-view-toggle-btn active" title="Visual Network Graph">
            <span>🕸 Graph</span>
          </button>
          <button id="btn-view-tree" class="mm-view-toggle-btn" title="Hierarchical Tree List">
            <span>🌳 Tree</span>
          </button>
        </div>

        <!-- Mobile Drawer Toggle -->
        <button id="btn-toggle-inspector" class="mm-control-btn mm-inspector-toggle-mobile" style="display: none; width: auto; padding: 0 12px; font-size: 12px;" title="Toggle Concept Inspector">
          <span>🧠 Inspector</span>
        </button>
      </div>
    </div>

    <!-- Interactive Mind Map Workspace Canvas & Inspector -->
    <div class="mm-workspace">
      
      <!-- Graph Canvas Container -->
      <div id="mm-canvas-container" class="mm-canvas-pane">
        <canvas id="mm-graph-canvas"></canvas>

        <!-- Centered Hint Badge -->
        <div class="mm-hint-badge">
          Click any node to inspect · Drag to rearrange · Scroll to zoom
        </div>

        <!-- Floating Controls (Zoom, Reset, Physics) -->
        <div class="mm-floating-controls">
          <button id="btn-zoom-in" class="mm-control-btn" title="Zoom In (+)">+</button>
          <button id="btn-zoom-out" class="mm-control-btn" title="Zoom Out (-)">−</button>
          <button id="btn-zoom-reset" class="mm-control-btn" title="Reset Camera (R)">⟲</button>
          <button id="btn-toggle-physics" class="mm-control-btn" style="color: #38bdf8;" title="Toggle Physics Simulation">⚡</button>
        </div>
      </div>

      <!-- Tree View Alternative Container -->
      <div id="mm-tree-container" class="mm-tree-pane">
        <!-- Rendered dynamically by chapter.js -->
      </div>

      <!-- Side Inspector Panel -->
      <div id="mm-inspector-panel" class="mm-inspector">
        <div id="mm-inspector-content">
          <!-- Populated dynamically by chapter.js -->
        </div>
      </div>

    </div>

  </main>

  <!-- Footer -->
  <footer style="width: 100%; background: #020c18; border-top: 1px solid var(--border-subtle); padding: 24px; box-sizing: border-box;">
    <div style="max-width: 1360px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px;">
      <span style="font-size: 13px; color: var(--text-muted);">
        © 2026 NovaLeran. Interactive Physics &amp; Science Curriculum.
      </span>
      <a href="index.html" style="font-size: 13px; color: var(--text-secondary); text-decoration: none;">
        ← Back to all courses
      </a>
    </div>
  </footer>

  <!-- Curriculum Data and Mind Map Engine Scripts -->
  <script src="curriculum-data.js?v=15"></script>
  <script src="chapter.js?v=15"></script>
</body>
</html>
